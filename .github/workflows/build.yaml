name: acceptance and publication
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: |
          uv venv .venv
          uv pip sync --python .venv/bin/python --require-hashes requirements-notebooks.txt
          .venv/bin/python scripts/cwl-docs.py --validate
          .venv/bin/python -m ipykernel install --user --name quickwin_env
          .venv/bin/python -m bash_kernel.install
      - name: Check transpiler-mate metadata
        run: |
          uv venv .oci-venv
          uv pip sync --python .oci-venv/bin/python --require-hashes requirements-oci.txt
          PATH="$PWD/.oci-venv/bin:$PATH" .oci-venv/bin/python scripts/check-metadata.py
      - name: Install notebook tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman uidmap
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64 -o /tmp/yq
          sudo install /tmp/yq /usr/local/bin/yq
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Execute all four real-data notebooks
        env:
          QUICKWIN_WORKSPACE: ${{ github.workspace }}
          VIRTUAL_ENV_DISABLE_PROMPT: '1'
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          python scripts/run-practice-labs.py --workspace "$PWD" --python-kernel quickwin_env --output /tmp/quickwin-results
          python scripts/check-results.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: /tmp/quickwin-results
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: acceptance
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("codemeta.json"))["version"])')
          if gh release view "$version" >/dev/null 2>&1; then echo "Release already exists" >&2; exit 1; fi
          image="ghcr.io/eoap/quickwin/detect-water-body:$version"
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if docker manifest inspect "$image" >/dev/null 2>&1; then echo "Image tag already exists" >&2; exit 1; fi
          docker build -t "$image" water-bodies/command-line-tools/detect-water-body
          docker push "$image"
          docker pull "$image"
          docker inspect "$image" --format '{{index .RepoDigests 0}}' > /tmp/image-digest
          uv venv .venv
          uv pip sync --python .venv/bin/python --require-hashes requirements-notebooks.txt
          .venv/bin/python scripts/prepare-release.py --image "$(cat /tmp/image-digest)"
          .venv/bin/python scripts/cwl-docs.py --validate
          mkdir -p downloads
          cp cwl-workflow/app-water-body-cloud-native.cwl "downloads/app-water-body-cloud-native.$version.cwl"
          cp cwl-cli/detect-water-body.cwl "downloads/detect-water-body.$version.cwl"
          cp cwl-cli/params.yaml downloads/cli-params.yaml
          cp cwl-workflow/params.yaml downloads/workflow-params.yaml
          cp requirements-notebooks.txt downloads/
          (cd downloads && sha256sum * > SHA256SUMS)
          tar czf "quickwin.$version.tar.gz" -C downloads .
          gh release create "$version" "quickwin.$version.tar.gz" downloads/* --target "$GITHUB_SHA" --title "$version" --notes 'Typed CWL v1.2 contracts, locked runtime dependencies, and acceptance-tested real Sentinel-2 processing.'
